version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "cron"
      cronjob: "15 0 * * 0"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    commit-message:
      prefix: "[GITHUB-ACTIONS] "
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 3

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: "cron"
      cronjob: "15 1 * * 0"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    versioning-strategy: increase
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    commit-message:
      prefix: "[PIP] "
    groups:
      uv-all:
        patterns:
          - "*"
    cooldown:
      default-days: 3

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: "cron"
      cronjob: "15 1 * * 0"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    versioning-strategy: increase
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    commit-message:
      prefix: "[UV] "
    groups:
      uv-all:
        patterns:
          - "*"
    cooldown:
      default-days: 3

  - package-ecosystem: terraform
    directories:
      - /
      - /modules
      - /workspace
    schedule:
      interval: "cron"
      cronjob: "15 1 * * 0"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    commit-message:
      prefix: "[TERRAFORM] "
    groups:
      terraform:
        patterns:
          - "*"
